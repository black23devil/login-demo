<!doctype html>
<html>
<head><meta charset="utf-8"/><title>Register</title></head>
<body>
  <h2>Register</h2>
  <form id="regForm">
    <label>Username: <input name="username" required></label><br>
    <label>Email: <input name="email" type="email" required></label><br>
    <label>Password: <input name="password" type="password" required></label><br>
    <label>Confirm: <input name="confirm" type="password" required></label><br>
    <button type="submit">Register</button>
  </form>
  <p id="msg"></p>
  <p><a href="index.html">Home</a></p>

  <script>
    const form = document.getElementById('regForm');
    const msg = document.getElementById('msg');

    function getUsers() {
      return JSON.parse(localStorage.getItem('users') || '[]');
    }
    function saveUsers(u){ localStorage.setItem('users', JSON.stringify(u)); }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(form);
      const username = fd.get('username').trim();
      const email = fd.get('email').trim().toLowerCase();
      const password = fd.get('password');
      const confirm = fd.get('confirm');

      if(password !== confirm){ msg.textContent = 'Passwords do not match.'; return; }

      const users = getUsers();
      if(users.some(u => u.email === email)){ msg.textContent = 'Email already registered.'; return; }

      users.push({ username, email, password }); // NOTE: demo only — not secure
      saveUsers(users);
      msg.textContent = 'Registered! You can now login. Redirecting...';
      setTimeout(()=> location.href = 'login.html', 1200);
    });
  </script>
</body>
</html>
